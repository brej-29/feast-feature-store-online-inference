name: Feast Materialize

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily

jobs:
  materialize:
    runs-on: ubuntu-latest

    env:
      FEAST_REPO_PATH: feature_repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature engineering (sample mode; skip if input missing)
        run: |
          python pipelines/feature_engineering.py \
            --skip_if_missing_input \
            --sample_rows 50000 \
            --max_entities 2000

      - name: Feast apply + materialize (if Postgres configured)
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "${POSTGRES_HOST:-}" ]; then
            echo "POSTGRES_HOST not set; skipping 'feast apply' and materialize."
            exit 0
          fi

          echo "Running 'feast apply' against Postgres-hosted online store..."
          bash scripts/feast_apply.sh

          echo "Running incremental materialization for snapshot FeatureViews..."
          bash scripts/feast_materialize_incremental.sh