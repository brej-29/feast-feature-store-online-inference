name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: mypy .

      - name: Unit tests
        run: pytest tests/ services/api/tests/ -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Integration tests (Testcontainers Postgres)
        run: pytest tests/ -q -m "integration and not spark"

  spark-parity:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # pyspark ships Spark itself but needs a JVM; ubuntu-latest runners
      # have one preinstalled via JAVA_HOME_17_X64.
      - name: Install dependencies (incl. offline Spark tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-spark.txt

      # Guards the claim that the Spark rewrite is equivalent to the pandas
      # reference -- if they ever diverge, this fails.
      - name: Spark/pandas parity
        run: pytest tests/test_spark_parity.py -q -m spark
