version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: feast-fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feature_store}
      POSTGRES_USER: ${POSTGRES_USER:-feature_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feature_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v23.1.17
    container_name: feast-fraud-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092"
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  stack:
    build: .
    container_name: feast-fraud-stack
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-feature_store}
      POSTGRES_USER: ${POSTGRES_USER:-feature_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feature_pass}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: txn_events
      FEAST_REPO_PATH: feature_repo
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  consumer:
    build: .
    container_name: feast-fraud-consumer
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-feature_store}
      POSTGRES_USER: ${POSTGRES_USER:-feature_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feature_pass}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: txn_events
      FEAST_REPO_PATH: feature_repo
      CONSUMER_METRICS_PORT: 9100
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    command: ["python", "-m", "services.streaming.kafka_consumer"]

volumes:
  postgres_data: