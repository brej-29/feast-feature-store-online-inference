version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: feast-fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feature_store}
      POSTGRES_USER: ${POSTGRES_USER:-feature_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feature_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpanda/redpanda:v23.1.17
    container_name: feast-fraud-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  stack:
    build: .
    container_name: feast-fraud-stack
    env_file:
      - .env
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres_data: