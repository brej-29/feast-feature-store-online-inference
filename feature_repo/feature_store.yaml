project: fraud_feature_store
registry: data/registry.db
provider: local

online_store:
  type: postgres
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  database: ${POSTGRES_DB}
  db_schema: public
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  # Driven by pipelines/pg_config: 'require' for managed hosts (Neon parses
  # this from POSTGRES_URL), 'disable' for local docker-compose. The Feast
  # CLI gets it via `eval $(python -m pipelines.pg_config --export)` in the
  # feast_apply/feast_materialize scripts; the API sets it in-process.
  sslmode: ${POSTGRES_SSLMODE}
  vector_enabled: false