global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:8000"

  # Kafka consumer's push-freshness metrics (feast_push_*). Only reachable in
  # the local docker-compose stack, where Prometheus (inside this container)
  # can resolve the separate "consumer" service by name. Not present in the
  # single-container HF Spaces deployment, where this target will simply
  # show as down -- harmless, since the consumer isn't run there either.
  - job_name: "kafka_consumer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "consumer:9100"