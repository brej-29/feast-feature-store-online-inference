[project]
name = "feast-fraud-feature-store"
version = "0.0.1"
description = "Step 0 scaffold for a free-tier compatible Feast feature store + FastAPI + Gradio + Prometheus stack."
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E203",  # whitespace before ':', conflicts with Black
    "E501",  # line length handled by Black
]
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.isort]
known-first-party = ["services", "feature_repo"]
combine-as-imports = true