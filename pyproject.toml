[project]
name = "feast-fraud-feature-store"
version = "0.0.1"
description = "Step 0 scaffold for a free-tier compatible Feast feature store + FastAPI + Gradio + Prometheus stack."
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E203",  # whitespace before ':', conflicts with Black
    "E501",  # line length handled by Black
]

[tool.ruff.lint.isort]
known-first-party = ["services", "feature_repo", "pipelines"]
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker (Testcontainers); slower, run separately from unit tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^notebooks/"]